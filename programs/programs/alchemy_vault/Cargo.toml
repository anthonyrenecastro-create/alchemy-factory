[package]
name = "alchemy_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "alchemy_vault"

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# token_2022_extensions is needed ONLY by alchemy_vault: it re-exports
# spl_token_metadata_interface + spl_pod, used to build the share mint's
# metadata-only (MetadataPointer + TokenMetadata) extensions. No other
# program enables it.
anchor-spl = { version = "0.31.1", features = ["token_2022", "token_2022_extensions"] }

[features]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

name: alchemy-factory-ci
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.31.1
          avm use 0.31.1
      - name: Install JS deps
        working-directory: programs
        run: npm ci
      - name: Pin deps for SBF toolchain
        # cargo-build-sbf uses the Solana platform-tools cargo (1.79), which
        # cannot parse edition2024 manifests. crates.io keeps releasing such
        # crates, and with no committed Cargo.lock a fresh resolve picks them
        # up and the build dies during resolution. So: resolve with the modern
        # host cargo, then pin the known offenders DOWN to pre-edition2024
        # versions before anchor build. If a future resolve pulls a NEW
        # edition2024 crate, the build error names it; add another pin here.
        # NOTE (2026-09-27): the indexmap pin was dropped — it was preemptive
        # and no build error has ever named indexmap as an edition2024 crate;
        # pinning it to 2.7.1 broke the resolve because toml_edit 0.25.x
        # (via proc-macro-crate 3.5 -> borsh-derive -> borsh -> solana-program)
        # requires indexmap ^2.13.0 (cargo exit 101). Only pin crates the
        # build actually names from now on. proc-macro-crate is pinned
        # unconditionally (no tree check): the `cargo tree -p` presence check
        # proved unreliable for it in CI even though the package IS in the
        # graph, and pinning it downgrades toml_edit as a side benefit.
        working-directory: programs
        run: |
          cargo generate-lockfile
          if ! cargo update -p proc-macro-crate --precise 3.2.0; then
            echo "proc-macro-crate pin not applicable, continuing"
          fi
          for pin in \
            "blake3:1.5.5" \
            "unicode-segmentation:1.12.0" \
            "zeroize_derive:1.4.2" \
            "zeroize:1.8.1" \
          ; do
            pkg="${pin%%:*}"; ver="${pin##*:}"
            if cargo tree -p "$pkg" --depth 0 >/dev/null 2>&1; then
              cargo update -p "$pkg" --precise "$ver"
            else
              echo "not in dependency graph, skipping pin: $pkg"
            fi
          done
      - name: Build programs
        working-directory: programs
        run: anchor build
      - name: Anchor tests (local validator)
        working-directory: programs
        run: anchor test
